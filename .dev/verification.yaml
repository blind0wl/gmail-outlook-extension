# Policy revision v2, 2026-09-30: portable full-suite command; gates unchanged.
version: 1
gates:
  automated-tests:
    kind: command
    required_for: [feature, bug, small-change, debt]
    command: ["npm", "test"]
    cwd: "."
    prerequisites: "npm ci (linkedom devDependency for popup-ui tests)"
    applicability: "Always required; headless CI covers adapters, cache, badge counts, retry, sanitization."
  human-gate:
    kind: acceptance
    required_for: [feature, bug]
    procedure: "docs/pr-checklist.md in Chrome with real accounts (load unpacked, badge/toast/chime/mute, stale/offline/sign-in recovery, thread links), plus docs/manual-auth.md for auth work. Record a dated acceptance note with ticked results."
    applicability: "Required for feature/bug; the suite cannot load the extension, see toasts, hear chimes, or sign in."
