<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="inbox-header">
    <h1>Inbox <span id="unread-count" aria-live="polite"></span></h1>
    <button id="provider-search" type="button" aria-label="Search mail in provider" title="Search mail in provider">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
    </button>
  </header>
  <nav class="pills" aria-label="Provider filter">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="gmail" aria-pressed="false">Gmail</button>
    <button type="button" data-filter="outlook" aria-pressed="false">Outlook</button>
  </nav>
  <section aria-label="Accounts">
    <p>Connect an account to read recent inbox mail and receive alerts. Mail stays in this browser.</p>
    <button id="add-gmail" type="button">Add Gmail</button>
    <button id="add-outlook" type="button">Add Outlook</button>
    <button id="refresh-mail" type="button">Refresh</button>
    <label><input id="skip-focused" type="checkbox" checked> Pause alerts while a provider tab is focused</label>
    <p id="lifecycle-message" role="status"></p>
    <ul id="account-controls"></ul>
  </section>
  <main>
    <ul id="inbox-list"></ul>
    <p id="inbox-empty" hidden>No mail cached yet.</p>
  </main>
  <section id="account-status" aria-label="Account status" hidden>
    <h2>Status</h2>
    <ul id="account-status-list"></ul>
  </section>
  <section id="sound-settings" aria-label="Sound settings">
    <h2>Sound</h2>
    <label><input type="checkbox" id="sound-muted"> Mute all sounds</label>
    <label>Volume <input type="range" id="sound-volume" min="0" max="100" step="1" value="50"> <span id="sound-volume-value"></span></label>
    <ul id="sound-accounts"></ul>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
